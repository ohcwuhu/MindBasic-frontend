    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#FFFAF6" />
    <link rel="icon" href="assets/logo-sprout.png" type="image/png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/base.css" />

  <body class="page-orders">
    <script src="scripts/auth-guard.js"></script>
    <script src="scripts/session-nav.js"></script>

    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="index.html" aria-label="斐思同行 首页">
          <img class="brand__mark" src="assets/logo-sprout.png" width="106" height="100" alt="" aria-hidden="true" />
          <span class="brand__name">斐思同行</span>
        </a>

        <nav class="nav" aria-label="主导航">
          <ul class="nav__list">
            <li><a class="nav__link" href="index.html">首页</a></li>
            <li><a class="nav__link" href="self-coaching.html">自我教练</a></li>
            <li><a class="nav__link" href="emotion-journal.html">情绪日记</a></li>
            <li><a class="nav__link is-current" href="coaches.html">真人教练</a></li>
            <li><a class="nav__link" href="articles.html">科普中心</a></li>
          </ul>
        </nav>

        <div class="masthead__actions">
          <a class="link-quiet" href="my-growth.html">个人中心</a>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="plate">
        <div class="wrap plate__inner">
          <nav class="crumbs" aria-label="位置">
            <a href="index.html">首页</a>
            <span aria-hidden="true">/</span>
            <a href="coaches.html">真人教练</a>
            <span aria-hidden="true">/</span>
            <span>我的订单</span>
          </nav>
          <h1 class="plate__title">我的订单</h1>
          <p class="plate__lede">付没付、退没退、教练确认到哪一步，都在这里对得上。</p>
        </div>
      </section>

      <div class="ground">
        <div class="wrap">
          <section class="panel" aria-labelledby="orders-title">
            <div class="panel__head panel__head--row">
              <h2 class="panel__title" id="orders-title">订单记录</h2>
              <p class="panel__note">待支付的订单会显示剩余时间，超时时段自动释放。</p>
            </div>

            <div class="orders-filter" data-order-filters role="group" aria-label="按状态筛选订单">
              <ul class="keys">
                <li><button class="key is-current" type="button" data-order-filter="ALL" aria-pressed="true">全部</button></li>
                <li><button class="key" type="button" data-order-filter="CREATED" aria-pressed="false">待支付</button></li>
                <li><button class="key" type="button" data-order-filter="PAID" aria-pressed="false">已支付</button></li>
                <li><button class="key" type="button" data-order-filter="CLOSED" aria-pressed="false">已关闭 / 已退款</button></li>
              </ul>
              <button class="btn btn--paper btn--small" type="button" data-orders-refresh>刷新订单</button>
            </div>

            <p class="panel__note orders-demo" data-demo-note hidden></p>
            <p class="panel__note" data-orders-status role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
            <div class="orders-list" data-orders-list>
              <p class="panel__note">正在读取订单…</p>
            </div>
          </section>

          <section class="panel appointments-panel" id="appointments" aria-labelledby="appointments-title">
            <div class="panel__head panel__head--row">
              <h2 class="panel__title" id="appointments-title" tabindex="-1">我的预约</h2>
              <p class="panel__note">改期请联系教练；这里可以先取消，服务完成后也能评价。</p>
            </div>
            <p class="panel__note" data-appointments-status role="status" aria-live="polite" aria-atomic="true"></p>
            <div class="orders-list" data-appointments-list>
              <p class="panel__note">正在读取预约…</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <p class="footer__hotline">
          心理援助热线 <a href="tel:12356">12356</a>
          <span class="footer__hint">如有危机或伤害自己的念头，请立即拨打热线，或前往就近医院急诊。</span>
        </p>
        <p class="footer__note">AI 陪伴不能替代专业诊疗，也不做任何医疗诊断。</p>
        <nav class="footer__links" aria-label="法务信息">
          <a href="terms.html">服务条款</a>
          <span aria-hidden="true">·</span>
          <a href="terms.html">隐私政策</a>
        </nav>
      </div>
    </footer>
    <script src="scripts/api.js"></script>
    <script src="scripts/orders.js"></script>
  </body>
</html>
