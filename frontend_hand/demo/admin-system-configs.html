        background: #f6f5e3;

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="斐思同行 · 管理工作台：热线、免责声明与协议版本。" />

    <link rel="stylesheet" href="styles/tokens.css" />

    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/base.css" />

  </head>
  <body class="page-admin">
    <script src="scripts/auth-guard.js"></script>
    <script src="scripts/session-nav.js"></script>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="index.html" aria-label="斐思同行 首页">
          <img class="brand__mark" src="assets/logo-sprout.png" width="106" height="100" alt="" aria-hidden="true" />
          <span class="brand__name">斐思同行</span>
        </a>

        <nav class="nav" aria-label="主导航">
          <ul class="nav__list">
            <li><a class="nav__link" href="index.html">首页</a></li>
            <li><a class="nav__link" href="self-coaching.html">自我教练</a></li>
            <li><a class="nav__link" href="emotion-journal.html">情绪日记</a></li>
            <li><a class="nav__link" href="coaches.html">真人教练</a></li>
            <li><a class="nav__link" href="articles.html">科普中心</a></li>
          </ul>
        </nav>

        <div class="masthead__actions">
          <a class="link-quiet" href="admin.html">管理工作台</a>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="plate">
        <div class="wrap plate__inner">
          <h1 class="plate__title">系统配置</h1>
          <p class="plate__lede">这几句话会出现在全站页脚与弹窗里，改之前先想清楚。</p>
        </div>
      </section>

      <div class="ground">
        <div class="wrap">
          <nav class="keys atabs" aria-label="管理工作台模块">
            <a class="key" href="admin.html">概览</a>
            <a class="key" href="admin-users.html">用户</a>
            <a class="key" href="admin-articles.html">内容</a>
            <a class="key" href="admin-coach-audits.html">教练审核</a>
            <a class="key" href="admin-orders.html">订单</a>
            <a class="key" href="admin-crisis.html">危机</a>
            <a class="key" href="admin-audit-logs.html">日志</a>
            <a class="key is-current" href="admin-system-configs.html" aria-current="page">配置</a>
          </nav>

          <section class="panel" aria-labelledby="config-title">
            <div class="panel__head panel__head--row">
              <h2 class="panel__title" id="config-title">全站共用的几句话</h2>
              <p class="panel__note">保存会写进审计日志。</p>
            </div>

            <form class="form" data-config-form novalidate>
              <div class="field">
                <label class="field__label" for="cfg-platform_name">平台名</label>
                <input class="input" id="cfg-platform_name" name="platform_name" maxlength="64" value="MindBasic" />
                <p class="field__hint">页脚与协议页里显示的名字。</p>
              </div>
              <div class="field">
                <label class="field__label" for="cfg-hotline">心理援助热线</label>
                <input class="input" id="cfg-hotline" name="hotline" maxlength="32" value="12356" />
                <p class="field__hint">全站页脚、AI 说明弹窗、危机提示都用它。</p>
              </div>
              <div class="field">
                <label class="field__label" for="cfg-emergency_hint">紧急情况提示</label>
                <textarea class="textarea" id="cfg-emergency_hint" name="emergency_hint" rows="3" maxlength="2000">如你正处于心理危机或紧急状态，请立即拨打全国心理援助热线 12356，或前往就近医疗机构寻求帮助。</textarea>
              </div>
              <div class="field">
                <label class="field__label" for="cfg-disclaimer">服务边界声明</label>
                <textarea class="textarea" id="cfg-disclaimer" name="disclaimer" rows="3" maxlength="2000">本平台提供成长陪伴与自助工具，不提供心理疾病诊断或治疗服务；如有医疗需求，请前往正规医疗机构就诊。</textarea>
              </div>
              <div class="field">
                <label class="field__label" for="cfg-ai_disclaimer">AI 免责声明</label>
                <textarea class="textarea" id="cfg-ai_disclaimer" name="ai_disclaimer" rows="3" maxlength="2000">AI 陪伴不能替代专业诊疗，也不做任何医疗诊断。</textarea>
              </div>
              <div class="field">
                <label class="field__label" for="cfg-agreement_version">服务协议版本号</label>
                <input class="input" id="cfg-agreement_version" name="agreement_version" maxlength="32" value="v1.2" />
                <p class="field__hint">改了协议正文就要抬这个号，用户下次登录会看到重新确认。</p>
              </div>

              <p class="field__error" data-form-error role="alert" hidden></p>
              <div class="field__row">
                <button class="btn" type="submit" data-save>保存修改</button>
                <button class="btn btn--paper" type="button" data-reload>重新读取</button>
              </div>
              <p class="panel__foot" data-status role="status" aria-live="polite" tabindex="-1"></p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <p class="footer__hotline">
          心理援助热线 <a href="tel:12356">12356</a>
          <span class="footer__hint">如有危机或伤害自己的念头，请立即拨打热线，或前往就近医院急诊。</span>
        </p>
        <p class="footer__note">AI 陪伴不能替代专业诊疗，也不做任何医疗诊断。</p>
        <nav class="footer__links" aria-label="法务信息">
          <a href="terms.html">服务条款</a>
          <span aria-hidden="true">·</span>
          <a href="terms.html">隐私政策</a>
        </nav>
      </div>
    </footer>
    <script src="scripts/api.js"></script>
    <script src="scripts/admin-system-configs.js"></script>
  </body>
</html>
