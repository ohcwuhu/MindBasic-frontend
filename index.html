<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心晞 · 心承微光，晞待朝明</title>
    <style>
      @font-face {
        font-family: 'Long Cang';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/longcang-brush.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Zhi Mang Xing';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/zhimang-brush.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Ma Shan Zheng';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/ma-shan-zheng-display.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/noto-sans-sc-subset-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('fonts/noto-sans-sc-subset-500.woff2') format('woff2');
      }

      :root {
        --surface: #f7f5f4;
        --ink: #3d323b;
        --ink-muted: #786a74;
        --plum: #795368;
        --plum-deep: #634354;
        --font-ui: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-hand: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', cursive;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--font-ui);
        color: var(--ink);
        background: var(--surface);
        overflow: hidden;
      }

      /* 整幅山景铺满视口，导航与文案都浮在图上 */
      .stage {
        position: fixed;
        inset: 0;
        background: url('assets/bg-home.png') center / cover no-repeat;
      }

      /* 顶部一层薄雾，让导航文字在星空中也清楚 */
      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgb(250 247 248 / 58%) 0%, rgb(250 247 248 / 0%) 26%);
      }

      /* 标题区背后的柔光，只提亮左侧，右侧的行星与云海保持原样 */
      .stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 42% 54% at 28% 42%,
          rgb(253 251 249 / 88%) 0%,
          rgb(253 251 249 / 62%) 36%,
          rgb(253 251 249 / 18%) 58%,
          rgb(253 251 249 / 0%) 74%
        );
      }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---------- 导航 ---------- */
      .masthead {
        display: flex;
        align-items: center;
        gap: 36px;
        padding: 24px clamp(22px, 3.4vw, 52px);
      }

      .masthead .brand .brand__name {
        font-family: 'Long Cang', 'KaiTi', cursive;
        font-size: 30px;
        letter-spacing: 0.1em;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        text-decoration: none;
        font-family: var(--font-hand);
        font-size: 26px;
        letter-spacing: 0.16em;
      }

      .brand img { flex: none; width: auto; height: 40px; object-fit: contain; }

      .nav {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 14px;
      }

      .nav a {
        padding: 9px 15px;
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 0.04em;
        transition: background-color 180ms, color 180ms;
      }

      .nav a:hover { background: rgb(253 251 249 / 55%); color: var(--plum-deep); }

      .nav a.is-current { color: var(--plum-deep); background: rgb(253 251 249 / 46%); }

      .masthead__actions {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-left: auto;
      }

      .link-quiet {
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
      }

      .link-quiet:hover { color: var(--plum-deep); }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        padding: 12px 22px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--plum);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.04em;
        box-shadow: 0 6px 20px rgb(121 83 104 / 18%);
        transition: background-color 180ms, transform 180ms, box-shadow 180ms;
      }

      .btn:hover { background: var(--plum-deep); transform: translateY(-1px); box-shadow: 0 9px 24px rgb(121 83 104 / 24%); }
      .btn:active { transform: translateY(1px); }
      .btn span { font-size: 18px; line-height: 1; }

      .btn--ghost {
        background: rgb(253 251 249 / 62%);
        color: var(--plum-deep);
        border-color: rgb(121 83 104 / 26%);
        box-shadow: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .btn--ghost:hover { background: rgb(253 251 249 / 88%); }

      /* ---------- 主文案 ---------- */
      main {
        flex: 1;
        display: flex;
        align-items: flex-start;
        padding: 11vh clamp(22px, 3.4vw, 52px) 0;
      }

      .hero {
        max-width: 780px;
      }

      .hero__title {
        margin: 0;
        font-family: 'Long Cang', 'Zhi Mang Xing', 'STXingkai', '华文行楷', cursive;
        font-weight: 400;
        font-size: clamp(64px, 7.8vw, 112px);
        line-height: 1.2;
        letter-spacing: 0.03em;
        color: var(--ink);
      }

      .hero__title span { display: block; }
      .hero__title span + span { padding-left: 1.7em; margin-top: 10px; color: var(--plum); }

      .hero__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        margin-top: 30px;
      }

      .hero__actions .btn { padding: 13px 24px; }

      /* ---------- 底部入口 ---------- */
      .entries {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 clamp(22px, 3.4vw, 52px) 26px;
      }

      .entry {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 22px;
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: 16px;
        background: rgb(30 20 32 / 22%);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.04em;
        transition: background-color 200ms, transform 200ms, border-color 200ms;
      }

      .entry:hover {
        background: rgb(30 20 32 / 38%);
        border-color: rgb(255 255 255 / 52%);
        transform: translateY(-3px);
      }

      .entry em {
        font-style: normal;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: rgb(255 255 255 / 62%);
      }

      .entry span { font-size: 15px; opacity: 0.8; }

      .footer {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 clamp(22px, 3.4vw, 52px) 24px;
        font-size: 12px;
        letter-spacing: 0.03em;
        color: rgb(255 255 255 / 62%);
      }

      .footer a { color: rgb(255 255 255 / 82%); text-decoration: none; }
      .footer a:hover { text-decoration: underline; }

      @media (prefers-reduced-motion: no-preference) {
        .hero { animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both; }
        .entries, .footer { animation: rise 900ms 140ms cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes rise {
          from { opacity: 0; transform: translateY(18px); }
          to { opacity: 1; transform: none; }
        }
      }

      @media (max-width: 1100px) {
        .masthead { gap: 22px; }
        .nav { margin-left: 0; }
        .nav a { padding-inline: 11px; font-size: 14px; }
        .hero { max-width: 620px; }
        .hero__title { font-size: clamp(54px, 7.4vw, 86px); }
      }

      @media (max-width: 820px) {
        body { overflow: auto; }
        .page { min-height: 100svh; height: auto; }
        .stage { background-position: 58% 50%; }
        .stage::after {
          background: linear-gradient(
            to bottom,
            rgb(253 251 249 / 86%) 0%,
            rgb(253 251 249 / 68%) 44%,
            rgb(253 251 249 / 10%) 72%,
            rgb(253 251 249 / 0%) 100%
          );
        }
        .nav { display: none; }
        .masthead { padding-block: 18px; }
        .link-quiet { display: none; }
        main { align-items: flex-start; padding-top: 7vh; }
        .hero { max-width: 100%; margin-top: 0; }
        .hero__title { font-size: clamp(46px, 15vw, 68px); line-height: 1.22; }
        .hero__title span + span { padding-left: 1.2em; margin-top: 8px; }
        .hero__actions { gap: 14px; margin-top: 24px; }
        .hero__actions .btn { padding: 11px 18px; font-size: 12px; gap: 16px; }
        .entries { flex-wrap: wrap; margin-top: auto; padding-top: 18vh; }
        .entry { flex: 1 1 42%; padding: 12px 16px; font-size: 12px; }
        .footer { flex-wrap: wrap; gap: 8px; font-size: 11px; }
      }
    </style>
  </head>
